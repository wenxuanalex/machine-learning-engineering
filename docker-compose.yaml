services:
  jupyter:
    build: .
    ports:
      - "8888:8888"
    volumes:
      # Mount relevant folders so edits reflect live without rebuilding the image
      - ./data:/app/data
      - ./utils:/app/utils
      - ./scripts:/app/scripts
      - ./eda:/app/eda
      - ./main.py:/app/main.py
      - ./src:/app/src
      - ./reports:/app/reports
      - ./mlruns:/app/mlruns
    environment:
      - JUPYTER_ENABLE_LAB=yes
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root", "--notebook-dir=/app", "--ServerApp.token=''", "--ServerApp.disable_check_xsrf=True", "--ContentsManager.autosave_interval=15"]

  mlflow:
    build: .
    ports:
      - "${MLFLOW_HOST_PORT:-5000}:5000"
    volumes:
      - ./data:/app/data
      - ./utils:/app/utils
      - ./scripts:/app/scripts
      - ./src:/app/src
      - ./reports:/app/reports
      - ./mlruns:/app/mlruns
    environment:
      - PYTHONPATH=/app
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "file:/app/mlruns", "--default-artifact-root", "file:/app/mlruns"]

  airflow:
    image: apache/airflow:2.9.3
    profiles: ["optional"]
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      # Make the project's `utils` package importable from the DAG
      - PYTHONPATH=/opt/airflow
      # The base Airflow image ships neither scikit-learn nor pyarrow, both of
      # which the gold pipeline needs. Pin to match requirements.txt.
      - _PIP_ADDITIONAL_REQUIREMENTS=pandas==2.2.3 numpy==1.26.4 scikit-learn==1.6.1 pyarrow
    volumes:
      - ./dags:/opt/airflow/dags
      # The DAG tasks chdir to /opt/airflow and call the same utils as main.py,
      # reading and writing the data layers in place.
      - ./utils:/opt/airflow/utils
      - ./data:/opt/airflow/data
    command: ["airflow", "standalone"]
