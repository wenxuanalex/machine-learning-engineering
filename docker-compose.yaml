services:
  jupyter:
    build: .
    ports:
      - "8888:8888"
    volumes:
      # Mount relevant folders so edits reflect live without rebuilding the image
      - ./data:/app/data
      - ./utils:/app/utils
      - ./scripts:/app/scripts
      - ./eda:/app/eda
      - ./main.py:/app/main.py
      - ./src:/app/src
      - ./reports:/app/reports
      - ./mlruns:/app/mlruns
    environment:
      - JUPYTER_ENABLE_LAB=yes
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root", "--notebook-dir=/app", "--ServerApp.token=''", "--ServerApp.disable_check_xsrf=True", "--ContentsManager.autosave_interval=15"]

  mlflow:
    build: .
    ports:
      - "${MLFLOW_HOST_PORT:-5000}:5000"
    volumes:
      - ./data:/app/data
      - ./utils:/app/utils
      - ./scripts:/app/scripts
      - ./src:/app/src
      - ./reports:/app/reports
      - ./mlruns:/app/mlruns
    environment:
      - PYTHONPATH=/app
    command:
      - bash
      - -lc
      - |
        umask 0002
        exec mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri file:/app/mlruns --serve-artifacts --artifacts-destination file:/app/mlruns

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    profiles: ["optional"]
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
      # Make the project's `utils` package importable from the DAG
      - PYTHONPATH=/opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      # The DAG tasks chdir to /opt/airflow and call the same utils as main.py,
      # reading and writing the data layers in place.
      - ./utils:/opt/airflow/utils
      - ./data:/opt/airflow/data
      # The weekly DAG writes drift/bias reports here; mount so they persist.
      - ./reports:/opt/airflow/reports
      - ./mlruns:/app/mlruns
    command:
      - bash
      - -c
      - |
        chmod -R a+rwx /app/mlruns || true
        airflow db migrate
        if airflow users list | grep -qE '^[[:space:]]*[0-9]+[[:space:]]*\|[[:space:]]*admin[[:space:]]*\|'; then
          airflow users reset-password --username admin --password admin
        else
          airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com
        fi
        exec airflow standalone

  serve:
    build: .
    profiles: ["optional"]
    ports:
      - "5001:5001"
    volumes:
      - ./mlruns:/app/mlruns
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONPATH=/app
    depends_on:
      - mlflow
    command: ["mlflow", "models", "serve", "-m", "models:/ChurnModel@Production", "-h", "0.0.0.0", "-p", "5001", "--env-manager", "local"]
